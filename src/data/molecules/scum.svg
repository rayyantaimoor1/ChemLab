<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Soap scum: one calcium ion holding TWO soap molecules at once, because it carries two positive charges where sodium carried one. The result will not dissolve">
  <circle cx="22" cy="60" r="18" fill="#6E8FA6" stroke="#161A19" stroke-width="2"/>
  <text x="22" y="67" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Ca</text>
  <text x="34" y="38" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">2+</text>
  <line x1="38" y1="52" x2="52" y2="40" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="38" y1="68" x2="52" y2="82" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="58" cy="36" r="10" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="58" y="40" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">O</text>
  <text x="50" y="26" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">-</text>
  <circle cx="58" cy="86" r="10" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="58" y="90" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">O</text>
  <text x="50" y="104" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">-</text>
  <line x1="64" y1="36" x2="79" y2="46" stroke="#161A19" stroke-width="2"/>
  <line x1="79" y1="46" x2="94" y2="36" stroke="#161A19" stroke-width="2"/>
  <line x1="94" y1="36" x2="109" y2="46" stroke="#161A19" stroke-width="2"/>
  <line x1="109" y1="46" x2="124" y2="36" stroke="#161A19" stroke-width="2"/>
  <line x1="124" y1="36" x2="139" y2="46" stroke="#161A19" stroke-width="2"/>
  <line x1="139" y1="46" x2="154" y2="36" stroke="#161A19" stroke-width="2"/>
  <line x1="64" y1="86" x2="79" y2="76" stroke="#161A19" stroke-width="2"/>
  <line x1="79" y1="76" x2="94" y2="86" stroke="#161A19" stroke-width="2"/>
  <line x1="94" y1="86" x2="109" y2="76" stroke="#161A19" stroke-width="2"/>
  <line x1="109" y1="76" x2="124" y2="86" stroke="#161A19" stroke-width="2"/>
  <line x1="124" y1="86" x2="139" y2="76" stroke="#161A19" stroke-width="2"/>
  <line x1="139" y1="76" x2="154" y2="86" stroke="#161A19" stroke-width="2"/>
  <text x="90" y="116" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">two chains, one calcium — insoluble</text>
</svg>
