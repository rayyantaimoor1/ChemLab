<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lead(IV) oxide: lead holding two oxygens in its higher oxidation state, which at the bottom of the group is the unstable one">
  <line x1="80" y1="56" x2="44" y2="56" stroke="#161A19" stroke-width="2"/>
  <line x1="80" y1="56" x2="116" y2="56" stroke="#161A19" stroke-width="2"/>
  <circle cx="80" cy="56" r="17" fill="#6E7B8B" stroke="#161A19" stroke-width="2"/>
  <text x="80" y="63" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Pb</text>
  <circle cx="44" cy="56" r="12" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="44" y="61" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">O</text>
  <circle cx="116" cy="56" r="12" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="116" y="61" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">O</text>
  <text x="70" y="30" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">4+</text>
  <text x="80" y="96" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">lead would rather be +2</text>
  <text x="80" y="108" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">so it TAKES electrons - an oxidising agent</text>
</svg>
