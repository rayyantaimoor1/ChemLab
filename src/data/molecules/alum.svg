  <line x1="96" y1="51" x2="96" y2="58" stroke="#161A19" stroke-width="2"/>
  <circle cx="96" cy="8" r="8" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="96" y="11" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">O</text>
  <circle cx="130" cy="38" r="8" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="130" y="41" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">O</text>
  <circle cx="96" cy="64" r="8" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="96" y="67" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">O</text>
