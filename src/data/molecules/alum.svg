  <line x1="109" y1="88" x2="120" y2="88" stroke="#161A19" stroke-width="2"/>
  <line x1="96" y1="101" x2="96" y2="108" stroke="#161A19" stroke-width="2"/>
  <line x1="83" y1="88" x2="76" y2="88" stroke="#161A19" stroke-width="2"/>
  <circle cx="130" cy="88" r="8" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="130" y="91" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">O</text>
  <circle cx="96" cy="114" r="8" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
