<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Alum: aluminium three plus with sulfate ions. The small, highly charged aluminium ion pulls so hard on the water around it that hydrogen ions are forced off, which is why an alum solution is acidic">
