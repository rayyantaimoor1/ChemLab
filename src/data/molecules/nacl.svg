<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sodium chloride: a sodium ion and a chloride ion, held together by ionic attraction">
  <line x1="54" y1="60" x2="90" y2="60" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="34" cy="60" r="20" fill="#8E44AD" stroke="#161A19" stroke-width="2"/>
  <text x="34" y="66" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF">Na</text>
  <text x="52" y="38" font-family="sans-serif" font-size="13" font-weight="bold" fill="#161A19">+</text>
  <circle cx="112" cy="60" r="24" fill="#2ECC71" stroke="#161A19" stroke-width="2"/>
  <text x="112" y="67" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0B3D1E">Cl</text>
  <text x="134" y="38" font-family="sans-serif" font-size="13" font-weight="bold" fill="#161A19">-</text>
</svg>
