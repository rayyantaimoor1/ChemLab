<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tetraamminezinc: four ammonia molecules around one zinc. Aluminium forms nothing of the kind, which is how the two hydroxides are finally separated. Note it is colourless, because zinc has a full d shell">
  <line x1="78" y1="50" x2="40" y2="26.44" stroke="#161A19" stroke-width="2"/>
  <line x1="78" y1="50" x2="116" y2="26.44" stroke="#161A19" stroke-width="2"/>
  <line x1="78" y1="50" x2="55.2" y2="79.64" stroke="#161A19" stroke-width="2"/>
  <line x1="78" y1="50" x2="100.8" y2="79.64" stroke="#161A19" stroke-width="2"/>
  <circle cx="40" cy="26.44" r="13" fill="#2E86C1" stroke="#161A19" stroke-width="2"/>
  <text x="40" y="31.44" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">N</text>
  <circle cx="116" cy="26.44" r="13" fill="#2E86C1" stroke="#161A19" stroke-width="2"/>
  <text x="116" y="31.44" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">N</text>
  <circle cx="55.2" cy="79.64" r="13" fill="#2E86C1" stroke="#161A19" stroke-width="2"/>
  <text x="55.2" y="84.64" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">N</text>
  <circle cx="100.8" cy="79.64" r="13" fill="#2E86C1" stroke="#161A19" stroke-width="2"/>
  <text x="100.8" y="84.64" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">N</text>
  <circle cx="78" cy="50" r="17" fill="#5D6D7E" stroke="#161A19" stroke-width="2"/>
  <text x="78" y="57" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Zn</text>
  <text x="98" y="30" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">2+</text>
  <text x="80" y="102" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">aluminium forms NO such complex — that is the test</text>
  <text x="80" y="113" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">colourless: zinc’s d shell is full</text>
</svg>
