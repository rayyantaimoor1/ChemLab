<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mercury(II) oxide: an oxide so weakly held together that gentle heating alone tears it into its elements, with no reducing agent at all">
  <line x1="58" y1="60" x2="74" y2="60" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="40" cy="60" r="19" fill="#B8B8C0" stroke="#161A19" stroke-width="2"/>
  <text x="40" y="67" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#161A19">Hg</text>
  <text x="56" y="34" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">2+</text>
  <circle cx="92" cy="60" r="16" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="92" y="66" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">O</text>
  <text x="108" y="34" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">2-</text>
  <path d="M 66 78 L 66 96 M 62 92 L 66 96 L 70 92" fill="none" stroke="#C0392B" stroke-width="2"/>
  <text x="80" y="110" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">heat ALONE splits this — no carbon, no electricity</text>
  <text x="80" y="119" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">which is what the bottom of the series means</text>
</svg>
