<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lead(II) chloride dissolved in hot water: the ions have come apart and each is surrounded by water molecules. Nothing has reacted — the solid has simply gone into solution, which silver chloride will not do">
  <circle cx="52" cy="54" r="19" fill="#7F8C8D" stroke="#161A19" stroke-width="2"/>
  <text x="52" y="61" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Pb</text>
  <text x="68" y="32" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">2+</text>
  <circle cx="118" cy="40" r="14" fill="#2ECC71" stroke="#161A19" stroke-width="2"/>
  <text x="118" y="45" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0B3D1E">Cl</text>
  <text x="130" y="26" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">-</text>
  <circle cx="112" cy="82" r="14" fill="#2ECC71" stroke="#161A19" stroke-width="2"/>
  <text x="112" y="87" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0B3D1E">Cl</text>
  <text x="124" y="100" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">-</text>
  <circle cx="22" cy="24" r="7" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>

  <circle cx="20" cy="84" r="7" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>

  <circle cx="76" cy="90" r="7" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>

  <circle cx="78" cy="18" r="7" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>

  <line x1="38" y1="40" x2="26" y2="30" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="38" y1="70" x2="26" y2="80" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="66" y1="70" x2="74" y2="84" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="66" y1="40" x2="74" y2="24" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="80" y="112" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">ions apart and hydrated — dissolved, not reacted</text>
</svg>
