<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Phenylethene: a benzene ring joined to a carbon to carbon double bond. The double bond polymerises and the ring ends up sticking out along the finished chain">
  <line x1="44" y1="42" x2="64.8" y2="54" stroke="#161A19" stroke-width="2.2"/>
  <line x1="64.8" y1="54" x2="64.8" y2="78" stroke="#161A19" stroke-width="2.2"/>
  <line x1="64.8" y1="78" x2="44" y2="90" stroke="#161A19" stroke-width="2.2"/>
  <line x1="44" y1="90" x2="23.2" y2="78" stroke="#161A19" stroke-width="2.2"/>
  <line x1="23.2" y1="78" x2="23.2" y2="54" stroke="#161A19" stroke-width="2.2"/>
  <line x1="23.2" y1="54" x2="44" y2="42" stroke="#161A19" stroke-width="2.2"/>
  <circle cx="44" cy="66" r="13.2" fill="none" stroke="#161A19" stroke-width="2"/>
  <line x1="44" y1="42" x2="76" y2="34" stroke="#161A19" stroke-width="2"/>
  <line x1="84" y1="30" x2="116" y2="30" stroke="#161A19" stroke-width="2"/>
  <line x1="84" y1="38" x2="116" y2="38" stroke="#161A19" stroke-width="2"/>
  <circle cx="80" cy="34" r="13" fill="#2C3E50" stroke="#161A19" stroke-width="2"/>
  <text x="80" y="39" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">C</text>
  <circle cx="122" cy="34" r="13" fill="#2C3E50" stroke="#161A19" stroke-width="2"/>
  <text x="122" y="39" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">C</text>
  <text x="80" y="104" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">C=C polymerises; the RING gets in the way</text>
  <text x="80" y="114" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">of the chains packing — hence rigid, not waxy</text>
</svg>
