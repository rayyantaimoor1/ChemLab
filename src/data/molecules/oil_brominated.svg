<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The same chain after bromine has added across the double bond. The kink is gone, the chain is saturated, and the orange colour of the bromine has gone with it">
