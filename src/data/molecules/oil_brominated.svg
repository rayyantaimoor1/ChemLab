  <text x="80" y="92" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">bromine added across the double bond</text>
  <text x="80" y="106" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">the orange colour disappears - that is the test</text>
