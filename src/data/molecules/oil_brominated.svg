  <line x1="80" y1="35" x2="94" y2="53" stroke="#161A19" stroke-width="2"/>
  <line x1="94" y1="53" x2="108" y2="35" stroke="#161A19" stroke-width="2"/>
  <line x1="108" y1="35" x2="122" y2="53" stroke="#161A19" stroke-width="2"/>
  <line x1="122" y1="53" x2="136" y2="35" stroke="#161A19" stroke-width="2"/>
