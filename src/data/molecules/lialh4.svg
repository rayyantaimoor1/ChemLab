  <text x="128" y="38" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#161A19">H</text>
  <circle cx="58" cy="90" r="11" fill="#F5F5F0" stroke="#161A19" stroke-width="2"/>
