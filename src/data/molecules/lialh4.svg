  <circle cx="122" cy="92" r="11" fill="#F5F5F0" stroke="#161A19" stroke-width="2"/>
  <text x="122" y="96" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#161A19">H</text>
