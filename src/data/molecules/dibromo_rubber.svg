<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Brominated rubber: bromine has added across the double bonds that were left along the chain. The product is useless, but the fact that it forms proves those double bonds were really there">
  <line x1="14" y1="39" x2="34" y2="53" stroke="#161A19" stroke-width="2.4"/>
  <line x1="34" y1="53" x2="54" y2="39" stroke="#161A19" stroke-width="2.4"/>
  <line x1="54" y1="39" x2="74" y2="53" stroke="#161A19" stroke-width="2.4"/>
  <line x1="74" y1="53" x2="94" y2="39" stroke="#161A19" stroke-width="2.4"/>
  <line x1="94" y1="39" x2="114" y2="53" stroke="#161A19" stroke-width="2.4"/>
  <line x1="114" y1="53" x2="134" y2="39" stroke="#161A19" stroke-width="2.4"/>
  <line x1="54" y1="53" x2="44" y2="72" stroke="#161A19" stroke-width="2"/>
  <circle cx="38" cy="78" r="11" fill="#A62929" stroke="#161A19" stroke-width="2"/>
  <text x="38" y="82" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">Br</text>
  <line x1="74" y1="39" x2="84" y2="22" stroke="#161A19" stroke-width="2"/>
  <circle cx="90" cy="16" r="11" fill="#A62929" stroke="#161A19" stroke-width="2"/>
  <text x="90" y="20" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">Br</text>
  <line x1="114" y1="53" x2="124" y2="72" stroke="#161A19" stroke-width="2"/>
  <circle cx="130" cy="78" r="11" fill="#A62929" stroke="#161A19" stroke-width="2"/>
  <text x="130" y="82" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">Br</text>
  <text x="80" y="104" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">Br added ACROSS the old double bonds —</text>
  <text x="80" y="114" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">the bromine water lost its colour doing it</text>
</svg>
