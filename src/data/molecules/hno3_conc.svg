<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nitric acid: nitrogen bonded to three oxygens, one of them carrying the acidic hydrogen. Concentrated, it acts as an oxidising and nitrating agent, not merely as an acid">
  <circle cx="80" cy="56" r="14" fill="#2E86C1" stroke="#161A19" stroke-width="2"/>
  <text x="80" y="61" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">N</text>
  <circle cx="80" cy="28" r="11" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="80" y="32" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF">O</text>
  <line x1="80" y1="40" x2="80" y2="32" stroke="#161A19" stroke-width="2"/>
  <line x1="80" y1="44" x2="80" y2="36" stroke="#161A19" stroke-width="2"/>
  <circle cx="54" cy="72" r="11" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="54" y="76" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF">O</text>
  <line x1="80" y1="56" x2="54" y2="72" stroke="#161A19" stroke-width="2"/>
  <circle cx="106" cy="72" r="11" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="106" y="76" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF">O</text>
  <line x1="80" y1="56" x2="106" y2="72" stroke="#161A19" stroke-width="2"/>
  <circle cx="122" cy="84" r="7" fill="#F5F5F0" stroke="#161A19" stroke-width="2"/>
  <text x="122" y="87" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#161A19">H</text>
  <line x1="106" y1="72" x2="122" y2="84" stroke="#161A19" stroke-width="2"/>
  <text x="80" y="104" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">concentrated: it nitrates and oxidises</text>
  <text x="80" y="115" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">which is why it stains skin yellow</text>
</svg>
