<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sodium iodide: a sodium ion and an iodide ion. Here it is the by-product of the iodoform reaction, carrying away the iodine that did not end up in the yellow solid">
  <line x1="56" y1="60" x2="88" y2="60" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="40" cy="60" r="17" fill="#8E44AD" stroke="#161A19" stroke-width="2"/>
  <text x="40" y="67" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Na</text>
  <text x="54" y="36" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">+</text>
  <circle cx="106" cy="60" r="18" fill="#6C3483" stroke="#161A19" stroke-width="2"/>
  <text x="106" y="67" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">I</text>
  <text x="122" y="36" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">-</text>
  <text x="80" y="106" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">the iodine that did NOT become iodoform</text>
</svg>
