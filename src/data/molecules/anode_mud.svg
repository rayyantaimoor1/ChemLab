<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Anode mud: loose silver and gold atoms that would not dissolve, lying on the floor of the refining tank. A large share of the world's silver is recovered from exactly this">
  <circle cx="48" cy="46" r="14" fill="#B0B7BD" stroke="#161A19" stroke-width="2"/>
  <text x="48" y="51" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">Ag</text>
  <circle cx="86" cy="38" r="14" fill="#D4AF37" stroke="#161A19" stroke-width="2"/>
  <text x="86" y="43" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">Au</text>
  <circle cx="116" cy="56" r="14" fill="#B0B7BD" stroke="#161A19" stroke-width="2"/>
  <text x="116" y="61" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">Ag</text>
  <circle cx="58" cy="80" r="14" fill="#D4AF37" stroke="#161A19" stroke-width="2"/>
  <text x="58" y="85" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">Au</text>
  <circle cx="96" cy="82" r="14" fill="#B0B7BD" stroke="#161A19" stroke-width="2"/>
  <text x="96" y="87" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">Ag</text>
  <text x="80" y="110" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">too hard to oxidise - so the current left them alone</text>
