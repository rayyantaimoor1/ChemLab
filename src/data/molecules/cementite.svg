<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cementite, iron carbide: one carbon atom bonded to three irons. Hard brittle particles of this scattered through steel are what stop the iron layers sliding, and so decide how hard the steel is">
  <line x1="80" y1="62" x2="80" y2="30" stroke="#161A19" stroke-width="2"/>
  <line x1="80" y1="62" x2="52" y2="82" stroke="#161A19" stroke-width="2"/>
  <line x1="80" y1="62" x2="108" y2="82" stroke="#161A19" stroke-width="2"/>
  <circle cx="80" cy="62" r="13" fill="#2C3E50" stroke="#161A19" stroke-width="2"/>
  <text x="80" y="67" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">C</text>
  <circle cx="80" cy="30" r="14" fill="#8A6A4F" stroke="#161A19" stroke-width="2"/>
  <text x="80" y="35" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">Fe</text>
  <circle cx="52" cy="82" r="14" fill="#8A6A4F" stroke="#161A19" stroke-width="2"/>
  <text x="52" y="87" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">Fe</text>
  <circle cx="108" cy="82" r="14" fill="#8A6A4F" stroke="#161A19" stroke-width="2"/>
  <text x="108" y="87" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">Fe</text>
  <text x="80" y="110" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">Fe3C - three irons to one carbon</text>
</svg>
