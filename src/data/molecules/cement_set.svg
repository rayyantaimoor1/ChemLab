  <circle cx="130" cy="32" r="9" fill="#6E8FA6" stroke="#161A19" stroke-width="2"/>
  <text x="130" y="35" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF"></text>
