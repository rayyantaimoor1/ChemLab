<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Set cement: a mat of crystals that have grown through the space the mixing water occupied and locked into one another. Cement hardens by reacting with water, not by drying, which is why it sets perfectly well underwater">
