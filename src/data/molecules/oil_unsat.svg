<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="An unsaturated chain: the double bond puts a permanent kink in it, so the molecules cannot pack neatly and the fat stays liquid">
  <line x1="24" y1="35" x2="38" y2="53" stroke="#161A19" stroke-width="2"/>
  <line x1="38" y1="53" x2="52" y2="35" stroke="#161A19" stroke-width="2"/>
  <line x1="52" y1="35" x2="66" y2="53" stroke="#161A19" stroke-width="2"/>
  <line x1="66" y1="53" x2="80" y2="35" stroke="#161A19" stroke-width="2"/>
  <line x1="80" y1="33" x2="94" y2="33" stroke="#161A19" stroke-width="2"/>
  <line x1="80" y1="37" x2="94" y2="37" stroke="#161A19" stroke-width="2"/>
  <line x1="94" y1="35" x2="108" y2="53" stroke="#161A19" stroke-width="2"/>
  <line x1="108" y1="53" x2="122" y2="35" stroke="#161A19" stroke-width="2"/>
  <line x1="122" y1="35" x2="136" y2="53" stroke="#161A19" stroke-width="2"/>
  <circle cx="80" cy="35" r="8" fill="#2C3E50" stroke="#161A19" stroke-width="2"/>
  <text x="80" y="38" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#FFFFFF">C</text>
  <circle cx="94" cy="35" r="8" fill="#2C3E50" stroke="#161A19" stroke-width="2"/>
  <text x="94" y="38" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#FFFFFF">C</text>
  <text x="80" y="72" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">the double bond kinks the chain</text>
  <text x="80" y="90" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">kinked chains cannot pack together</text>
  <text x="80" y="104" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">so it is a liquid oil, not a solid fat</text>
</svg>
