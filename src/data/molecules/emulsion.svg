<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A milky emulsion: fat droplets too fine to settle, suspended through the water and scattering light, which is why it looks white">
  <rect x="26" y="26" width="108" height="62" fill="#F2F2EE" stroke="#161A19" stroke-width="2"/>
  <circle cx="44" cy="42" r="5" fill="#E4D9B8" stroke="#161A19" stroke-width="1.5"/>
  <circle cx="66" cy="56" r="7" fill="#E4D9B8" stroke="#161A19" stroke-width="1.5"/>
  <circle cx="92" cy="40" r="6" fill="#E4D9B8" stroke="#161A19" stroke-width="1.5"/>
  <circle cx="112" cy="60" r="5" fill="#E4D9B8" stroke="#161A19" stroke-width="1.5"/>
  <circle cx="58" cy="76" r="6" fill="#E4D9B8" stroke="#161A19" stroke-width="1.5"/>
  <circle cx="88" cy="72" r="5" fill="#E4D9B8" stroke="#161A19" stroke-width="1.5"/>
  <circle cx="116" cy="36" r="4" fill="#E4D9B8" stroke="#161A19" stroke-width="1.5"/>
  <circle cx="72" cy="34" r="4" fill="#E4D9B8" stroke="#161A19" stroke-width="1.5"/>
  <text x="80" y="104" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">droplets, not a solution</text>
  <text x="80" y="115" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">they scatter light - and that is the white</text>
</svg>
