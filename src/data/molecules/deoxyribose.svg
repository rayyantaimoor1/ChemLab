<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Deoxyribose: a five-membered sugar ring. The carbon at the lower right carries only a hydrogen where ribose has a hydroxyl, which is what deoxy means">
