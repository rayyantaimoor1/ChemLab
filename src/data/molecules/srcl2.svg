<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Strontium chloride: a strontium ion with two chlorides. Colourless in solution and chemically almost indistinguishable from calcium and barium, which is why the flame test is needed">
  <circle cx="80" cy="56" r="17" fill="#5B8CA6" stroke="#161A19" stroke-width="2"/>
  <text x="80" y="63" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Sr</text>
  <text x="94" y="34" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">2+</text>
  <line x1="60" y1="62" x2="34" y2="76" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="100" y1="62" x2="126" y2="76" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="34" cy="76" r="13" fill="#27AE60" stroke="#161A19" stroke-width="2"/>
  <text x="34" y="81" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">Cl</text>
  <text x="20" y="60" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">-</text>
  <circle cx="126" cy="76" r="13" fill="#27AE60" stroke="#161A19" stroke-width="2"/>
  <text x="126" y="81" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">Cl</text>
  <text x="138" y="60" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">-</text>
  <text x="80" y="104" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">nothing in solution tells it from calcium</text>
  <text x="80" y="115" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">or barium - only the flame does</text>
</svg>
