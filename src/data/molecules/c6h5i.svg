<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Iodobenzene: iodine on a benzene ring, which cannot be made by the direct route at all because iodine is too unreactive for a halogen carrier. The diazonium route is how it is actually done">
  <line x1="74" y1="32" x2="98.2" y2="46" stroke="#161A19" stroke-width="2.2"/>
  <line x1="98.2" y1="46" x2="98.2" y2="74" stroke="#161A19" stroke-width="2.2"/>
  <line x1="98.2" y1="74" x2="74" y2="88" stroke="#161A19" stroke-width="2.2"/>
  <line x1="74" y1="88" x2="49.8" y2="74" stroke="#161A19" stroke-width="2.2"/>
  <line x1="49.8" y1="74" x2="49.8" y2="46" stroke="#161A19" stroke-width="2.2"/>
  <line x1="49.8" y1="46" x2="74" y2="32" stroke="#161A19" stroke-width="2.2"/>
  <circle cx="74" cy="60" r="15.4" fill="none" stroke="#161A19" stroke-width="2"/>
  <line x1="98.2" y1="46" x2="112.04943194729591" y2="37.98793193131641" stroke="#161A19" stroke-width="2"/>
  <rect x="101.0" y="30.5" width="22" height="15" rx="5" fill="#D7C6E8" stroke="#161A19" stroke-width="1.8"/>
  <text x="112.0" y="42.0" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#161A19">I</text>
  <text x="80" y="108" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">no direct route exists — this needs the</text>
  <text x="80" y="117" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">diazonium doorway to get here at all</text>
</svg>
