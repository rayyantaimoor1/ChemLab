<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Barium oxide: the end of the Group 2 trend, left only after the fiercest heating of the four carbonates">
  <circle cx="54" cy="58" r="18" fill="#4A6E8A" stroke="#161A19" stroke-width="2"/>
  <text x="54" y="65" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">Ba</text>
  <text x="68" y="36" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">2+</text>
  <line x1="78" y1="58" x2="104" y2="58" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="118" cy="58" r="13" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="118" y="63" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">O</text>
  <text x="130" y="36" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">2-</text>
  <text x="80" y="100" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">the largest ion, and the most stubborn carbonate</text>
  <text x="80" y="112" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">350, 900, 1290, 1360 - Mg to Ba</text>
