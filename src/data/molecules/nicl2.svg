<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nickel(II) chloride: one nickel ion with two chlorides. In water it is really the green hexaaqua ion, with six waters bonded to the nickel">
  <line x1="48" y1="60" x2="66" y2="60" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="106" y1="60" x2="124" y2="60" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="30" cy="60" r="16" fill="#2ECC71" stroke="#161A19" stroke-width="2"/>
  <text x="30" y="66" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0B3D1E">Cl</text>
  <text x="42" y="40" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">-</text>
  <circle cx="86" cy="60" r="20" fill="#8FA5A8" stroke="#161A19" stroke-width="2"/>
  <text x="86" y="68" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#161A19">Ni</text>
  <text x="104" y="36" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">2+</text>
  <circle cx="142" cy="60" r="16" fill="#2ECC71" stroke="#161A19" stroke-width="2"/>
  <text x="142" y="66" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0B3D1E">Cl</text>
  <text x="152" y="40" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">-</text>
  <text x="80" y="100" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">in water this is really [Ni(H₂O)₆]²⁺ — green</text>
</svg>
