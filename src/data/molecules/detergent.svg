<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A detergent: the same long tail as soap, but with a sulfonate head instead of the acid head. That one swap is why its calcium salt stays dissolved and it lathers in hard water">
  <rect x="4" y="6" width="152" height="34" rx="8" fill="none" stroke="#8A8A8A" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="80" y="20" text-anchor="middle" font-family="sans-serif" font-size="9" font-style="italic" fill="#4A4A4A">sulfonate head — stays dissolved</text>
  <line x1="28" y1="44" x2="40" y2="48" stroke="#161A19" stroke-width="2"/>
  <line x1="20" y1="62" x2="20" y2="74" stroke="#161A19" stroke-width="2"/>
  <circle cx="22" cy="50" r="14" fill="#F1C40F" stroke="#161A19" stroke-width="2"/>
  <text x="22" y="55" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#161A19">S</text>
  <circle cx="20" cy="80" r="10" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="20" y="84" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">O</text>
  <text x="30" y="74" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">-</text>
  <line x1="46" y1="50" x2="59" y2="63" stroke="#161A19" stroke-width="2"/>
  <line x1="59" y1="63" x2="72" y2="50" stroke="#161A19" stroke-width="2"/>
  <line x1="72" y1="50" x2="85" y2="63" stroke="#161A19" stroke-width="2"/>
  <line x1="85" y1="63" x2="98" y2="50" stroke="#161A19" stroke-width="2"/>
  <line x1="98" y1="50" x2="111" y2="63" stroke="#161A19" stroke-width="2"/>
  <line x1="111" y1="63" x2="124" y2="50" stroke="#161A19" stroke-width="2"/>
  <line x1="124" y1="50" x2="137" y2="63" stroke="#161A19" stroke-width="2"/>
  <line x1="137" y1="63" x2="150" y2="50" stroke="#161A19" stroke-width="2"/>
  <text x="100" y="112" text-anchor="middle" font-family="sans-serif" font-size="9" font-style="italic" fill="#4A4A4A">same tail as soap</text>
</svg>
