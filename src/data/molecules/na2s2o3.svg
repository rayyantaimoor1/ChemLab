<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Thiosulfate: a sulfate ion with one oxygen swapped for a SULFUR. That swapped sulfur is the whole point, because soft donor atoms like sulfur grip soft metal ions like silver far more tightly than oxygen does">
