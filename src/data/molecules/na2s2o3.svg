  <line x1="80" y1="58" x2="80" y2="92" stroke="#161A19" stroke-width="2"/>
  <circle cx="80" cy="58" r="17" fill="#F1C40F" stroke="#161A19" stroke-width="2"/>
  <text x="80" y="65" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#161A19">S</text>
  <circle cx="80" cy="22" r="15" fill="#F1C40F" stroke="#161A19" stroke-width="2"/>
  <text x="80" y="28" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#161A19">S</text>
  <circle cx="42" cy="80" r="11" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="42" y="84" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">O</text>
  <circle cx="118" cy="80" r="11" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="118" y="84" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">O</text>
  <circle cx="80" cy="100" r="11" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="80" y="104" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">O</text>
  <text x="102" y="34" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">2-</text>
  <text x="80" y="116" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">this S replaces an O — soft donor, grips silver</text>
