<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Methanal: the only aldehyde whose carbonyl carbon carries TWO hydrogens. That is why a Grignard added to it can only ever give a primary alcohol">
  <line x1="74" y1="56" x2="74" y2="32" stroke="#161A19" stroke-width="2"/>
  <line x1="82" y1="56" x2="82" y2="32" stroke="#161A19" stroke-width="2"/>
  <line x1="66" y1="70" x2="44" y2="84" stroke="#161A19" stroke-width="2"/>
  <line x1="90" y1="70" x2="112" y2="84" stroke="#161A19" stroke-width="2"/>
  <circle cx="78" cy="62" r="16" fill="#2C3E50" stroke="#161A19" stroke-width="2"/>
  <text x="78" y="68" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">C</text>
  <circle cx="78" cy="24" r="13" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="78" y="29" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">O</text>
  <circle cx="34" cy="90" r="12" fill="#F5F5F0" stroke="#161A19" stroke-width="2"/>
  <text x="34" y="95" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#161A19">H</text>
  <circle cx="122" cy="90" r="12" fill="#F5F5F0" stroke="#161A19" stroke-width="2"/>
  <text x="122" y="95" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#161A19">H</text>
  <text x="80" y="114" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">TWO H on the carbonyl carbon — unique among aldehydes</text>
</svg>
