<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sodium nitrite: a bent nitrite ion with a sodium ion beside it. Never used as it comes — mixed with cold acid it makes the nitrous acid that a diazotisation actually needs">
  <line x1="80" y1="52" x2="52" y2="76" stroke="#161A19" stroke-width="2"/>
  <line x1="80" y1="52" x2="108" y2="76" stroke="#161A19" stroke-width="2"/>
  <circle cx="80" cy="52" r="15" fill="#2E86C1" stroke="#161A19" stroke-width="2"/>
  <text x="80" y="58" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">N</text>
  <circle cx="44" cy="84" r="12" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="44" y="89" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">O</text>
  <circle cx="116" cy="84" r="12" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="116" y="89" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">O</text>
  <text x="96" y="34" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">-</text>
  <line x1="80" y1="37" x2="80" y2="22" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="80" cy="14" r="12" fill="#8E44AD" stroke="#161A19" stroke-width="2"/>
  <text x="80" y="19" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">Na</text>
  <text x="94" y="12" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">+</text>
  <text x="80" y="110" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">BENT, not straight — the N keeps a lone pair</text>
</svg>
