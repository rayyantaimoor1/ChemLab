<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nickel(II) sulfide: a nickel ion and a sulfide ion. Black, and indistinguishable from cobalt sulfide, so a further specific test is needed">
  <circle cx="54" cy="58" r="17" fill="#8FA5A8" stroke="#161A19" stroke-width="2"/>
  <text x="54" y="65" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#161A19">Ni</text>
  <text x="66" y="38" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">2+</text>
  <line x1="76" y1="58" x2="104" y2="58" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="118" cy="58" r="15" fill="#F1C40F" stroke="#161A19" stroke-width="2"/>
  <text x="118" y="64" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#161A19">S</text>
  <text x="130" y="38" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">2-</text>
  <text x="80" y="100" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">black - and so is cobalt sulfide</text>
  <text x="80" y="112" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">a group narrows it; only a specific test closes it</text>
</svg>
