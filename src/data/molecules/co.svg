<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Carbon monoxide: one carbon and one oxygen held by a triple bond. It is the gas that does the real reducing in a blast furnace, and it is odourless, colourless and lethal">
  <line x1="56" y1="54" x2="96" y2="54" stroke="#161A19" stroke-width="2"/>
  <line x1="56" y1="60" x2="96" y2="60" stroke="#161A19" stroke-width="2"/>
  <line x1="56" y1="66" x2="96" y2="66" stroke="#161A19" stroke-width="2"/>
  <circle cx="44" cy="60" r="17" fill="#2C3E50" stroke="#161A19" stroke-width="2"/>
  <text x="44" y="67" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">C</text>
  <circle cx="108" cy="60" r="16" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="108" y="66" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">O</text>
  <text x="80" y="100" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">a TRIPLE bond — one of the strongest there is</text>
  <text x="80" y="112" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">no colour, no smell, and it kills</text>
</svg>
