<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The sulfite ion: sulfur with three oxygens and a lone pair, carrying two negative charges. One oxygen fewer than sulfate, which is the entire difference between the two tests">
  <line x1="80" y1="60" x2="80" y2="32" stroke="#161A19" stroke-width="2"/>
  <line x1="80" y1="60" x2="52" y2="80" stroke="#161A19" stroke-width="2"/>
  <line x1="80" y1="60" x2="108" y2="80" stroke="#161A19" stroke-width="2"/>
  <circle cx="80" cy="60" r="15" fill="#F1C40F" stroke="#161A19" stroke-width="2"/>
  <text x="80" y="66" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#161A19">S</text>
  <circle cx="80" cy="32" r="12" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="80" y="37" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">O</text>
  <circle cx="52" cy="80" r="12" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="52" y="85" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">O</text>
  <circle cx="108" cy="80" r="12" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="108" y="85" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">O</text>
  <text x="106" y="38" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">2-</text>
  <text x="80" y="106" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">THREE oxygens - sulfate has four</text>
  <text x="80" y="116" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">and that is why acid can attack this one</text>
</svg>
