<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ziegler-Natta catalyst: a titanium halide together with an aluminium alkyl. It is a MIXTURE, not a single compound, so this is a sketch of what is in it rather than a formula. The titanium is what grips each monomer and holds it in a fixed orientation as it joins the chain">
