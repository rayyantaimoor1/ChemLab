  <text x="26" y="33" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0B3D1E">Cl</text>
  <line x1="70" y1="50" x2="100" y2="44" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="3,3"/>
