  <circle cx="80" cy="58" r="17" fill="#7A8B99" stroke="#161A19" stroke-width="2"/>
  <text x="80" y="65" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Si</text>
  <circle cx="44" cy="26" r="13" fill="#2ECC71" stroke="#161A19" stroke-width="2"/>
  <text x="44" y="31" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0B3D1E">Cl</text>
