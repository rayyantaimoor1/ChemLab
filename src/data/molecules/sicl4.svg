  <circle cx="118" cy="94" r="13" fill="#2ECC71" stroke="#161A19" stroke-width="2"/>
  <text x="118" y="99" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0B3D1E">Cl</text>
  <text x="80" y="114" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">CCl₄ looks the same and does not react — Si has d orbitals</text>
