<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aluminium chloride in water: the small, triply charged aluminium ion pulls so hard on the water molecules around it that a hydrogen ion is forced off one of them, which is why the solution is acidic">
  <circle cx="56" cy="56" r="17" fill="#9AA7B0" stroke="#161A19" stroke-width="2"/>
  <text x="56" y="63" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#161A19">Al</text>
  <text x="70" y="34" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">3+</text>
  <line x1="56" y1="39" x2="56" y2="24" stroke="#161A19" stroke-width="2"/>
  <line x1="43" y1="66" x2="28" y2="76" stroke="#161A19" stroke-width="2"/>
  <line x1="69" y1="66" x2="84" y2="76" stroke="#161A19" stroke-width="2"/>
  <circle cx="56" cy="16" r="11" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="56" y="20" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">O</text>
  <circle cx="20" cy="84" r="11" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="20" y="88" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">O</text>
  <circle cx="92" cy="84" r="11" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="92" y="88" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">O</text>
  <line x1="66" y1="12" x2="78" y2="8" stroke="#161A19" stroke-width="2"/>
  <circle cx="86" cy="6" r="8" fill="#F5F5F0" stroke="#161A19" stroke-width="2"/>
  <text x="86" y="9" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#161A19">H</text>
  <path d="M 66 20 Q 92 26 104 40" fill="none" stroke="#C0392B" stroke-width="2" stroke-dasharray="4,3"/>
  <circle cx="112" cy="44" r="10" fill="#F5F5F0" stroke="#161A19" stroke-width="2"/>
  <text x="112" y="48" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#161A19">H</text>
  <text x="122" y="34" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">+</text>
  <line x1="112" y1="56" x2="124" y2="74" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="132" cy="84" r="13" fill="#2ECC71" stroke="#161A19" stroke-width="2"/>
  <text x="132" y="89" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0B3D1E">Cl</text>
  <text x="80" y="110" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">the red arrow is the H⁺ being pulled off a water —</text>
  <text x="80" y="118" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">that is the whole reason this salt is acidic</text>
</svg>
