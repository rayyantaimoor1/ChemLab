<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nitrous acid: too unstable to keep in a bottle, so it is made in the flask from sodium nitrite and acid at the moment it is needed">
  <line x1="72" y1="48" x2="46" y2="30" stroke="#161A19" stroke-width="2"/>
  <line x1="78" y1="54" x2="52" y2="36" stroke="#161A19" stroke-width="2"/>
  <line x1="88" y1="62" x2="112" y2="78" stroke="#161A19" stroke-width="2"/>
  <circle cx="78" cy="54" r="15" fill="#2E86C1" stroke="#161A19" stroke-width="2"/>
  <text x="78" y="60" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">N</text>
  <circle cx="36" cy="24" r="12" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="36" y="29" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">O</text>
  <circle cx="120" cy="84" r="12" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="120" y="89" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">O</text>
  <line x1="130" y1="80" x2="140" y2="74" stroke="#161A19" stroke-width="2"/>
  <circle cx="146" cy="70" r="9" fill="#F5F5F0" stroke="#161A19" stroke-width="2"/>
  <text x="146" y="73" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#161A19">H</text>
  <text x="80" y="108" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">falls apart on standing, and faster when warm —</text>
  <text x="80" y="117" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">which is why it is made cold and used at once</text>
</svg>
