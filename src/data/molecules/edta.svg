  <circle cx="42" cy="60" r="8" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="42" y="63" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#FFFFFF">O</text>
