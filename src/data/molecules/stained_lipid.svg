<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sudan-stained fat: two layers, with the dye collected in the upper fat layer and the water below left colourless">
  <rect x="30" y="24" width="100" height="34" fill="#D4453B" stroke="#161A19" stroke-width="2"/>
  <rect x="30" y="58" width="100" height="34" fill="#EEF3F5" stroke="#161A19" stroke-width="2"/>
  <text x="80" y="44" text-anchor="middle" font-family="sans-serif" font-size="9" font-style="italic" fill="#4A4A4A">fat - the dye is all in here</text>
  <text x="80" y="78" text-anchor="middle" font-family="sans-serif" font-size="9" font-style="italic" fill="#4A4A4A">water - untouched</text>
  <text x="80" y="108" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">nothing reacted; the dye simply chose a side</text>
</svg>
