<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Phosphorus(V) oxide: separate covalent molecules rather than a lattice, with four phosphorus atoms in a cage. Because the electrons are shared instead of handed over, this is an acidic oxide">
