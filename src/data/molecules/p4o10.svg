  <line x1="80" y1="82" x2="80" y2="26" stroke="#161A19" stroke-width="2"/>
  <line x1="50" y1="44" x2="24" y2="30" stroke="#161A19" stroke-width="2"/>
  <line x1="110" y1="44" x2="136" y2="30" stroke="#161A19" stroke-width="2"/>
  <line x1="80" y1="82" x2="80" y2="102" stroke="#161A19" stroke-width="2"/>
  <line x1="80" y1="26" x2="80" y2="8" stroke="#161A19" stroke-width="2"/>
  <circle cx="50" cy="44" r="13" fill="#D98E32" stroke="#161A19" stroke-width="2"/>
  <text x="50" y="49" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">P</text>
  <circle cx="110" cy="44" r="13" fill="#D98E32" stroke="#161A19" stroke-width="2"/>
  <text x="110" y="49" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">P</text>
  <circle cx="80" cy="82" r="13" fill="#D98E32" stroke="#161A19" stroke-width="2"/>
  <text x="80" y="87" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">P</text>
  <circle cx="80" cy="26" r="13" fill="#D98E32" stroke="#161A19" stroke-width="2"/>
  <text x="80" y="31" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">P</text>
  <circle cx="16" cy="24" r="9" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>

  <circle cx="144" cy="24" r="9" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>

