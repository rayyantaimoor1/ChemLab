  <circle cx="80" cy="4" r="8" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>

  <text x="80" y="118" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">COVALENT molecules — which is why it is acidic</text>
</svg>
