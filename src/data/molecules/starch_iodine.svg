<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The starch iodine complex: the starch chain has coiled into a helix and iodine molecules sit threaded down the tube in the middle. They are trapped, not bonded, which is why warming makes the blue-black colour vanish">
