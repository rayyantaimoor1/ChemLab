<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sodium oxide: a lattice of separate sodium ions and oxide ions. The bonding is fully ionic, and it is the free oxide ion that makes this the most strongly basic oxide of the period">
  <line x1="40" y1="40" x2="80" y2="60" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="120" y1="40" x2="80" y2="60" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="40" y1="84" x2="80" y2="60" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="120" y1="84" x2="80" y2="60" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="80" cy="60" r="18" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="80" y="67" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">O</text>
  <text x="96" y="38" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">2-</text>
  <circle cx="28" cy="32" r="14" fill="#8E44AD" stroke="#161A19" stroke-width="2"/>
  <text x="28" y="37" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">Na</text>
  <text x="40" y="20" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">+</text>
  <circle cx="132" cy="32" r="14" fill="#8E44AD" stroke="#161A19" stroke-width="2"/>
  <text x="132" y="37" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">Na</text>
  <text x="144" y="20" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">+</text>
  <circle cx="28" cy="92" r="12" fill="#8E44AD" stroke="#161A19" stroke-width="2"/>
  <text x="28" y="97" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">Na</text>
  <circle cx="132" cy="92" r="12" fill="#8E44AD" stroke="#161A19" stroke-width="2"/>
  <text x="132" y="97" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">Na</text>
  <text x="80" y="112" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">IONIC — free oxide ions, which is why it is basic</text>
</svg>
