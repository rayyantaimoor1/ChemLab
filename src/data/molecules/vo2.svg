  <circle cx="130" cy="98" r="8" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>

  <text x="84" y="116" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">V is +5 — TWO oxides held on, plus water round it</text>
