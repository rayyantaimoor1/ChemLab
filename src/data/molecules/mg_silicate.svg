<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Magnesium silicate: the same kind of reaction with the roles reversed - here the basic magnesia lining is the one being eaten by acidic silica in the charge">
  <line x1="84" y1="58" x2="84" y2="32" stroke="#161A19" stroke-width="2"/>
  <line x1="84" y1="58" x2="58" y2="78" stroke="#161A19" stroke-width="2"/>
  <line x1="84" y1="58" x2="110" y2="78" stroke="#161A19" stroke-width="2"/>
  <circle cx="84" cy="58" r="16" fill="#7A8B99" stroke="#161A19" stroke-width="2"/>
  <text x="84" y="64" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">Si</text>
  <circle cx="84" cy="24" r="11" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="84" y="28" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF">O</text>
  <circle cx="48" cy="86" r="11" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="48" y="90" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF">O</text>
  <circle cx="120" cy="86" r="11" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="120" y="90" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF">O</text>
  <line x1="66" y1="46" x2="36" y2="34" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="24" cy="28" r="13" fill="#86A17A" stroke="#161A19" stroke-width="2"/>
  <text x="24" y="33" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#161A19">Mg</text>
  <line x1="102" y1="46" x2="132" y2="34" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="144" cy="28" r="13" fill="#86A17A" stroke="#161A19" stroke-width="2"/>
  <text x="144" y="33" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#161A19">Mg</text>
  <text x="80" y="108" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">TWO Mg per silicate — and this time it is</text>
  <text x="80" y="117" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">the lining being eaten, not the charge</text>
</svg>
