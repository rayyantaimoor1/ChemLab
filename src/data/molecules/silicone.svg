  <text x="78" y="61" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">Si</text>
  <line x1="78" y1="42" x2="78" y2="28" stroke="#161A19" stroke-width="2"/>
  <circle cx="78" cy="22" r="10" fill="#2C3E50" stroke="#161A19" stroke-width="2"/>
  <text x="78" y="26" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">C</text>
