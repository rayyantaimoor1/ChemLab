<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ethylmagnesium bromide: the magnesium sits between the carbon and the bromine, and the carbon now carries a slight NEGATIVE charge where in bromoethane it was positive. That reversal is what makes a Grignard attack rather than be attacked">
  <line x1="34" y1="66" x2="68" y2="46" stroke="#161A19" stroke-width="2"/>
  <line x1="34" y1="66" x2="34" y2="88" stroke="#161A19" stroke-width="2"/>
  <line x1="34" y1="66" x2="14" y2="78" stroke="#161A19" stroke-width="2"/>
  <line x1="68" y1="46" x2="68" y2="26" stroke="#161A19" stroke-width="2"/>
  <line x1="80" y1="46" x2="100" y2="46" stroke="#161A19" stroke-width="2"/>
  <circle cx="34" cy="66" r="13" fill="#2C3E50" stroke="#161A19" stroke-width="2"/>
  <text x="34" y="71" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">C</text>
  <circle cx="68" cy="46" r="13" fill="#2C3E50" stroke="#161A19" stroke-width="2"/>
  <text x="68" y="51" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">C</text>
  <circle cx="114" cy="46" r="16" fill="#86A17A" stroke="#161A19" stroke-width="2"/>
  <text x="114" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#161A19">Mg</text>
  <line x1="130" y1="46" x2="140" y2="46" stroke="#161A19" stroke-width="2"/>
  <circle cx="150" cy="46" r="12" fill="#A62929" stroke="#161A19" stroke-width="2"/>
  <text x="150" y="51" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">Br</text>
  <circle cx="34" cy="96" r="8" fill="#F5F5F0" stroke="#161A19" stroke-width="2"/>
  <text x="34" y="99" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#161A19">H</text>
  <circle cx="6" cy="84" r="8" fill="#F5F5F0" stroke="#161A19" stroke-width="2"/>
  <text x="6" y="87" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#161A19">H</text>
  <circle cx="68" cy="18" r="8" fill="#F5F5F0" stroke="#161A19" stroke-width="2"/>
  <text x="68" y="21" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#161A19">H</text>
  <text x="20" y="54" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">δ−</text>
  <text x="80" y="106" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">this carbon is δ− — in C₂H₅Br it was δ+</text>
  <text x="80" y="116" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">a nucleophile now, not an electrophile</text>
</svg>
