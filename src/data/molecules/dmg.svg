  <circle cx="101" cy="24" r="12" fill="#2E86C1" stroke="#161A19" stroke-width="2"/>
  <text x="101" y="29" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">N</text>
  <line x1="59" y1="12" x2="44" y2="6" stroke="#161A19" stroke-width="2"/>
