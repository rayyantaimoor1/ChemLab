  <line x1="56" y1="52" x2="34" y2="68" stroke="#161A19" stroke-width="2"/>
  <line x1="104" y1="52" x2="126" y2="68" stroke="#161A19" stroke-width="2"/>
  <circle cx="56" cy="52" r="13" fill="#2C3E50" stroke="#161A19" stroke-width="2"/>
