  <circle cx="26" cy="74" r="11" fill="#2C3E50" stroke="#161A19" stroke-width="2"/>
  <text x="26" y="78" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">C</text>
  <circle cx="134" cy="74" r="11" fill="#2C3E50" stroke="#161A19" stroke-width="2"/>
  <text x="134" y="78" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">C</text>
  <path d="M 59 40 Q 80 62 101 40" fill="none" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="80" y="100" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">these two N atoms grip the metal —</text>
