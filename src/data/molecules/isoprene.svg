<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Isoprene: a diene, with TWO carbon to carbon double bonds. Polymerising uses only one of them, and the other survives into the rubber chain - which is what everything else in this batch depends on">
  <line x1="26" y1="44" x2="58" y2="44" stroke="#161A19" stroke-width="2"/>
  <line x1="26" y1="52" x2="58" y2="52" stroke="#161A19" stroke-width="2"/>
  <line x1="66" y1="48" x2="94" y2="66" stroke="#161A19" stroke-width="2"/>
  <line x1="102" y1="62" x2="130" y2="44" stroke="#161A19" stroke-width="2"/>
  <line x1="106" y1="69" x2="134" y2="51" stroke="#161A19" stroke-width="2"/>
  <circle cx="20" cy="48" r="14" fill="#2C3E50" stroke="#161A19" stroke-width="2"/>
  <text x="20" y="53" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">C</text>
  <circle cx="62" cy="48" r="14" fill="#2C3E50" stroke="#161A19" stroke-width="2"/>
  <text x="62" y="53" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">C</text>
  <circle cx="98" cy="64" r="14" fill="#2C3E50" stroke="#161A19" stroke-width="2"/>
  <text x="98" y="69" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">C</text>
  <circle cx="138" cy="46" r="14" fill="#2C3E50" stroke="#161A19" stroke-width="2"/>
  <text x="138" y="51" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">C</text>
  <line x1="62" y1="34" x2="62" y2="18" stroke="#161A19" stroke-width="2"/>
  <circle cx="62" cy="12" r="11" fill="#2C3E50" stroke="#161A19" stroke-width="2"/>
  <text x="62" y="16" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">C</text>
  <text x="42" y="30" text-anchor="middle" font-family="sans-serif" font-size="9" font-style="italic" fill="#4A4A4A">C=C</text>
  <text x="120" y="84" text-anchor="middle" font-family="sans-serif" font-size="9" font-style="italic" fill="#4A4A4A">C=C</text>
  <text x="80" y="104" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">TWO double bonds — one is used up polymerising,</text>
  <text x="80" y="114" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">the other stays in every unit of the rubber</text>
</svg>
