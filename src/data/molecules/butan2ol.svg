<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Butan-2-ol: a SECONDARY alcohol. The carbon holding the OH has two other carbons on it and only one hydrogen left">
  <line x1="20" y1="72" x2="52" y2="52" stroke="#161A19" stroke-width="2"/>
  <line x1="52" y1="52" x2="84" y2="72" stroke="#161A19" stroke-width="2"/>
  <line x1="84" y1="72" x2="116" y2="52" stroke="#161A19" stroke-width="2"/>
  <line x1="52" y1="52" x2="52" y2="30" stroke="#161A19" stroke-width="2"/>
  <circle cx="20" cy="72" r="13" fill="#2C3E50" stroke="#161A19" stroke-width="2"/>
  <text x="20" y="77" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">C</text>
  <circle cx="52" cy="52" r="13" fill="#2C3E50" stroke="#161A19" stroke-width="2"/>
  <text x="52" y="57" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">C</text>
  <circle cx="84" cy="72" r="13" fill="#2C3E50" stroke="#161A19" stroke-width="2"/>
  <text x="84" y="77" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">C</text>
  <circle cx="116" cy="52" r="13" fill="#2C3E50" stroke="#161A19" stroke-width="2"/>
  <text x="116" y="57" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">C</text>
  <circle cx="52" cy="20" r="11" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="52" y="24" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">O</text>
  <line x1="62" y1="16" x2="72" y2="10" stroke="#161A19" stroke-width="2"/>
  <circle cx="78" cy="6" r="8" fill="#F5F5F0" stroke="#161A19" stroke-width="2"/>
  <text x="78" y="9" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#161A19">H</text>
  <circle cx="38" cy="40" r="8" fill="#F5F5F0" stroke="#161A19" stroke-width="2"/>
  <text x="38" y="43" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#161A19">H</text>
  <line x1="52" y1="52" x2="42" y2="44" stroke="#161A19" stroke-width="2"/>
  <text x="80" y="104" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">ONE H left on the C–OH carbon → SECONDARY</text>
  <text x="80" y="115" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">can be oxidised once, to a ketone, then it stops</text>
</svg>
