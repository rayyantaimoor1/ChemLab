<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Natural rubber latex: rubber particles held apart in water because every one of them carries the same charge and repels its neighbours. Cancel that charge and they clump together">
  <circle cx="34" cy="34" r="14" fill="#E8E2CE" stroke="#161A19" stroke-width="2"/>

  <text x="34" y="17" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#161A19">−</text>
  <circle cx="96" cy="28" r="14" fill="#E8E2CE" stroke="#161A19" stroke-width="2"/>

  <text x="96" y="11" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#161A19">−</text>
  <circle cx="62" cy="68" r="14" fill="#E8E2CE" stroke="#161A19" stroke-width="2"/>

  <text x="62" y="51" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#161A19">−</text>
  <circle cx="124" cy="62" r="14" fill="#E8E2CE" stroke="#161A19" stroke-width="2"/>

  <text x="124" y="45" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#161A19">−</text>
  <circle cx="26" cy="88" r="14" fill="#E8E2CE" stroke="#161A19" stroke-width="2"/>

  <text x="26" y="71" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#161A19">−</text>
  <circle cx="92" cy="94" r="14" fill="#E8E2CE" stroke="#161A19" stroke-width="2"/>

  <text x="92" y="77" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#161A19">−</text>
  <text x="80" y="112" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">each particle carries the SAME charge,</text>
  <text x="80" y="120" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">so they push apart and never settle</text>
</svg>
