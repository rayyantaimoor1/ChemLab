<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Strontium carbonate: a white precipitate, and so are the calcium and barium carbonates that come down with it. Three identical-looking solids from one reagent">
  <circle cx="40" cy="58" r="16" fill="#5B8CA6" stroke="#161A19" stroke-width="2"/>
  <text x="40" y="64" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Sr</text>
  <text x="52" y="38" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">2+</text>
  <line x1="104" y1="58" x2="104" y2="32" stroke="#161A19" stroke-width="2"/>
  <line x1="104" y1="58" x2="86" y2="78" stroke="#161A19" stroke-width="2"/>
  <line x1="104" y1="58" x2="124" y2="78" stroke="#161A19" stroke-width="2"/>
  <circle cx="104" cy="58" r="13" fill="#2C3E50" stroke="#161A19" stroke-width="2"/>
  <text x="104" y="63" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">C</text>
  <circle cx="104" cy="32" r="10" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="104" y="36" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#FFFFFF">O</text>
  <circle cx="86" cy="78" r="10" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="86" y="82" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#FFFFFF">O</text>
  <circle cx="124" cy="78" r="10" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="124" y="82" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#FFFFFF">O</text>
  <text x="126" y="38" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">2-</text>
  <text x="80" y="104" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">white - like calcium and barium carbonate</text>
  <text x="80" y="115" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">this is where wet chemistry runs out</text>
</svg>
