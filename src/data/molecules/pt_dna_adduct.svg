<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Platinum bonded to two neighbouring bases on one DNA strand, putting a kink in the helix that the cell cannot copy past">
  <path d="M24 88 C 44 88, 54 40, 78 40 C 92 40, 96 62, 112 62 C 126 62, 130 84, 138 88" fill="none" stroke="#8A8F98" stroke-width="7" stroke-linecap="round"/>
  <circle cx="78" cy="40" r="10" fill="#2E86C1" stroke="#161A19" stroke-width="2"/>
  <text x="78" y="44" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#FFFFFF">N</text>
  <circle cx="112" cy="62" r="10" fill="#2E86C1" stroke="#161A19" stroke-width="2"/>
  <text x="112" y="66" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#FFFFFF">N</text>
  <line x1="78" y1="40" x2="92" y2="22" stroke="#161A19" stroke-width="2"/>
  <line x1="112" y1="62" x2="96" y2="26" stroke="#161A19" stroke-width="2"/>
  <circle cx="94" cy="20" r="12" fill="#C9CDD1" stroke="#161A19" stroke-width="2"/>
  <text x="94" y="25" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#161A19">Pt</text>
  <text x="80" y="106" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">bonded to two ADJACENT bases</text>
  <text x="80" y="116" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">and the helix is kinked where it cannot be</text>
</svg>
