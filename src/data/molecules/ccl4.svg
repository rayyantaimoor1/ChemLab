<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tetrachloromethane: a small carbon atom completely surrounded by four large chlorines, leaving no room for a water molecule to get at it">
  <line x1="80" y1="52" x2="80" y2="22" stroke="#161A19" stroke-width="2"/>
  <line x1="80" y1="52" x2="52" y2="70" stroke="#161A19" stroke-width="2"/>
  <line x1="80" y1="52" x2="108" y2="70" stroke="#161A19" stroke-width="2"/>
  <line x1="80" y1="52" x2="90" y2="78" stroke="#161A19" stroke-width="2"/>
  <circle cx="80" cy="52" r="11" fill="#2C3E50" stroke="#161A19" stroke-width="2"/>
  <text x="80" y="56" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF">C</text>
  <circle cx="80" cy="22" r="14" fill="#27AE60" stroke="#161A19" stroke-width="2"/>
  <text x="80" y="27" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">Cl</text>
  <circle cx="52" cy="70" r="14" fill="#27AE60" stroke="#161A19" stroke-width="2"/>
  <text x="52" y="75" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">Cl</text>
  <circle cx="108" cy="70" r="14" fill="#27AE60" stroke="#161A19" stroke-width="2"/>
  <text x="108" y="75" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">Cl</text>
  <circle cx="90" cy="78" r="14" fill="#27AE60" stroke="#161A19" stroke-width="2"/>
  <text x="90" y="83" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">Cl</text>
  <text x="80" y="100" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">the carbon is small and completely shielded</text>
  <text x="80" y="112" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">water has no way in - so nothing happens</text>
</svg>
