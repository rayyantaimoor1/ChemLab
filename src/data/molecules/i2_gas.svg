<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Iodine vapour: two iodine atoms joined, and the violet colour that gave the element its name">
  <line x1="56" y1="58" x2="104" y2="58" stroke="#161A19" stroke-width="2.5"/>
  <circle cx="52" cy="58" r="20" fill="#8E44AD" stroke="#161A19" stroke-width="2"/>
  <text x="52" y="66" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF">I</text>
  <circle cx="108" cy="58" r="20" fill="#8E44AD" stroke="#161A19" stroke-width="2"/>
  <text x="108" y="66" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF">I</text>
  <text x="80" y="96" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">violet as a gas, brown in solution</text>
  <text x="80" y="108" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">the same molecule, and the solvent makes the difference</text>
</svg>
