<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Biuret reagent: copper two plus in strong sodium hydroxide. It is a MIXTURE, not a compound, so this is a sketch of what is in the bottle rather than a formula">
  <circle cx="54" cy="54" r="22" fill="#B5651D" stroke="#161A19" stroke-width="2"/>
  <text x="54" y="62" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">Cu</text>
  <text x="72" y="28" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">2+</text>
  <line x1="80" y1="54" x2="100" y2="54" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="112" cy="54" r="13" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="112" y="59" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">O</text>
  <circle cx="140" cy="54" r="13" fill="#F5F5F0" stroke="#161A19" stroke-width="2"/>
  <text x="140" y="59" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">H</text>
  <line x1="124" y1="54" x2="128" y2="54" stroke="#161A19" stroke-width="2"/>
  <text x="120" y="30" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">-</text>
  <text x="80" y="90" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">copper(II) in plenty of sodium hydroxide</text>
  <text x="80" y="104" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">pale blue on its own — violet with a protein</text>
</svg>
