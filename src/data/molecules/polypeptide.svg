<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A polypeptide: amino acids joined by amide links, the same kind of link as in nylon. In a real protein the side group changes from unit to unit, and that order is what makes one protein an enzyme and another a hair">
  <line x1="4" y1="56" x2="18" y2="56" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="142" y1="56" x2="156" y2="56" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="18" y1="56" x2="44" y2="56" stroke="#161A19" stroke-width="2.4"/>
  <line x1="70" y1="56" x2="96" y2="56" stroke="#161A19" stroke-width="2.4"/>
  <line x1="122" y1="56" x2="142" y2="56" stroke="#161A19" stroke-width="2.4"/>
  <circle cx="30" cy="56" r="11" fill="#2C3E50" stroke="#161A19" stroke-width="2"/>
  <text x="30" y="60" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">C</text>
  <circle cx="84" cy="56" r="11" fill="#2C3E50" stroke="#161A19" stroke-width="2"/>
  <text x="84" y="60" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">C</text>
  <circle cx="132" cy="56" r="11" fill="#2C3E50" stroke="#161A19" stroke-width="2"/>
  <text x="132" y="60" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">C</text>
  <rect x="42" y="46" width="30" height="20" rx="6" fill="#CFDCE8" stroke="#161A19" stroke-width="1.8"/>
  <text x="57" y="60" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#161A19">CONH</text>
  <rect x="94" y="46" width="30" height="20" rx="6" fill="#CFDCE8" stroke="#161A19" stroke-width="1.8"/>
  <text x="109" y="60" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#161A19">CONH</text>
  <line x1="44" y1="56" x2="42" y2="56" stroke="#161A19" stroke-width="2"/>
  <line x1="72" y1="56" x2="70" y2="56" stroke="#161A19" stroke-width="2"/>
  <line x1="96" y1="56" x2="94" y2="56" stroke="#161A19" stroke-width="2"/>
  <line x1="124" y1="56" x2="122" y2="56" stroke="#161A19" stroke-width="2"/>
  <text x="80" y="92" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">the SAME amide links as the nylon —</text>
  <text x="80" y="102" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">but a real protein varies the side group</text>
  <text x="80" y="112" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">on every unit, and that order is the point</text>
</svg>
