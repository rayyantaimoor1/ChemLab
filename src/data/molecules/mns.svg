<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Manganese(II) sulfide: a manganese ion and a sulfide ion. Almost every other sulfide in the analysis scheme is black; this one is a soft pinkish buff, which makes manganese easy to spot">
  <circle cx="54" cy="58" r="17" fill="#7D5BA6" stroke="#161A19" stroke-width="2"/>
  <text x="54" y="65" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Mn</text>
  <text x="66" y="38" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">2+</text>
  <line x1="76" y1="58" x2="104" y2="58" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="118" cy="58" r="15" fill="#F1C40F" stroke="#161A19" stroke-width="2"/>
  <text x="118" y="64" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#161A19">S</text>
  <text x="130" y="38" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">2-</text>
  <text x="80" y="100" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">the only sulfide here that is not black</text>
  <text x="80" y="112" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">so the colour alone nearly identifies it</text>
</svg>
