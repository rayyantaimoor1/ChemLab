<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Barium sulfite: a barium ion holding a sulfite ion. Identical in appearance to barium sulfate, and told apart only by adding dilute acid">
  <circle cx="40" cy="60" r="16" fill="#4A6E8A" stroke="#161A19" stroke-width="2"/>
  <text x="40" y="66" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Ba</text>
  <text x="52" y="42" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">2+</text>
  <line x1="104" y1="60" x2="104" y2="34" stroke="#161A19" stroke-width="2"/>
  <line x1="104" y1="60" x2="84" y2="80" stroke="#161A19" stroke-width="2"/>
  <line x1="104" y1="60" x2="124" y2="80" stroke="#161A19" stroke-width="2"/>
  <circle cx="104" cy="60" r="13" fill="#F1C40F" stroke="#161A19" stroke-width="2"/>
  <text x="104" y="65" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#161A19">S</text>
  <circle cx="104" cy="34" r="10" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="104" y="38" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#FFFFFF">O</text>
  <circle cx="84" cy="80" r="10" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="84" y="84" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#FFFFFF">O</text>
  <circle cx="124" cy="80" r="10" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="124" y="84" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#FFFFFF">O</text>
  <text x="126" y="40" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">2-</text>
  <text x="80" y="108" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">looks exactly like barium sulfate</text>
  <text x="80" y="117" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">until dilute acid is added</text>
</svg>
