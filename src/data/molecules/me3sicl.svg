<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Trimethylchlorosilane: three methyl groups and only ONE chlorine, so hydrolysis leaves a single OH. One reactive end cannot build a chain - it caps one and stops">
