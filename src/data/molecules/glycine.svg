  <circle cx="80" cy="60" r="13" fill="#2C3E50" stroke="#161A19" stroke-width="2"/>
  <text x="80" y="65" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">C</text>
  <circle cx="112" cy="40" r="12" fill="#2C3E50" stroke="#161A19" stroke-width="2"/>
