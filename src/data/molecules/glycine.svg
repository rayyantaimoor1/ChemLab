<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Glycine: an amine group at one end and an acid group at the other, on the same small molecule. That is why one compound alone can polymerise, where a polyester needs two different monomers">
