  <text x="156" y="75" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#161A19">H</text>
  <text x="34" y="84" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">amine</text>
  <text x="120" y="84" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">acid</text>
  <text x="80" y="106" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">BOTH kinds of group on one molecule —</text>
  <text x="80" y="115" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">so it can join to another copy of itself</text>
