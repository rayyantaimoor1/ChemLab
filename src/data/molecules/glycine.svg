  <text x="8" y="41" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#161A19">H</text>
  <line x1="112" y1="29" x2="112" y2="18" stroke="#161A19" stroke-width="2"/>
  <circle cx="112" cy="12" r="9" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="112" y="15" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">O</text>
  <line x1="122" y1="46" x2="134" y2="54" stroke="#161A19" stroke-width="2"/>
  <circle cx="140" cy="58" r="9" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="140" y="61" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">O</text>
