  <text x="132" y="60" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">C</text>
  <line x1="44" y1="56" x2="45" y2="56" stroke="#161A19" stroke-width="2"/>
