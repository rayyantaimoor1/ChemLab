  <line x1="72" y1="56" x2="70" y2="56" stroke="#161A19" stroke-width="2"/>
  <line x1="96" y1="56" x2="94" y2="56" stroke="#161A19" stroke-width="2"/>
  <line x1="124" y1="56" x2="122" y2="56" stroke="#161A19" stroke-width="2"/>
  <text x="80" y="92" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">the blue blocks are AMIDE links —</text>
  <text x="80" y="102" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">exactly the bond that joins amino acids</text>
  <text x="80" y="112" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">into a protein. Nylon is a synthetic one.</text>
