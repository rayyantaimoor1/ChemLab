<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nylon: carbon chains joined by amide links. It is the same bond that joins amino acids into a protein, which is why nylon is strong for the same reason silk is">
