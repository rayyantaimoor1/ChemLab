<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Calcium silicate: a silicate group with calcium ions. Formed when a basic oxide meets an acidic one at furnace heat - useful as slag in a blast furnace, ruinous when it is the lining being consumed">
  <line x1="88" y1="58" x2="88" y2="32" stroke="#161A19" stroke-width="2"/>
  <line x1="88" y1="58" x2="62" y2="78" stroke="#161A19" stroke-width="2"/>
  <line x1="88" y1="58" x2="114" y2="78" stroke="#161A19" stroke-width="2"/>
  <circle cx="88" cy="58" r="16" fill="#7A8B99" stroke="#161A19" stroke-width="2"/>
  <text x="88" y="64" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">Si</text>
  <circle cx="88" cy="24" r="11" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="88" y="28" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF">O</text>
  <circle cx="52" cy="86" r="11" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="52" y="90" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF">O</text>
  <circle cx="124" cy="86" r="11" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="124" y="90" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF">O</text>
  <line x1="70" y1="46" x2="40" y2="34" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="28" cy="28" r="13" fill="#6E8FA6" stroke="#161A19" stroke-width="2"/>
  <text x="28" y="33" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#161A19">Ca</text>
  <text x="80" y="108" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">a BASIC oxide met an ACIDIC one —</text>
  <text x="80" y="117" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">the same reaction, useful or ruinous by context</text>
</svg>
