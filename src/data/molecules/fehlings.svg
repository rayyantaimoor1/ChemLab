<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fehling’s solution: copper two plus held in alkali by tartrate ions. It is a MIXTURE, not a single compound, so this is a sketch of what is in it rather than a formula">
  <circle cx="52" cy="56" r="22" fill="#B5651D" stroke="#161A19" stroke-width="2"/>
  <text x="52" y="64" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">Cu</text>
  <text x="70" y="30" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">2+</text>
  <line x1="76" y1="56" x2="100" y2="56" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="3,3"/>
  <rect x="100" y="40" width="52" height="32" rx="8" fill="#D5DBDB" stroke="#161A19" stroke-width="2"/>
  <text x="126" y="61" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#161A19">tartrate</text>
  <text x="80" y="100" text-anchor="middle" font-family="sans-serif" font-size="11" font-style="italic" fill="#4A4A4A">in sodium hydroxide solution</text>
</svg>
