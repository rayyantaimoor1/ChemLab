  <text x="110" y="84" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">N</text>
  <circle cx="80" cy="60" r="17" fill="#8FA5A8" stroke="#161A19" stroke-width="2"/>
  <text x="80" y="67" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#161A19">Ni</text>
