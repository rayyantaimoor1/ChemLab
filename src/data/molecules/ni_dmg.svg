  <line x1="41" y1="87" x2="34" y2="91" stroke="#161A19" stroke-width="2"/>
  <line x1="119" y1="87" x2="126" y2="91" stroke="#161A19" stroke-width="2"/>
  <text x="80" y="112" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">FOUR N in a flat square — no charge, so it will not dissolve</text>
