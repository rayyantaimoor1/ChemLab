<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Magnesium hydroxybromide: the magnesium residue left after a Grignard reaction is worked up. Of no interest in itself, but the magnesium has to end up somewhere">
  <line x1="56" y1="60" x2="40" y2="46" stroke="#161A19" stroke-width="2"/>
  <line x1="88" y1="60" x2="108" y2="74" stroke="#161A19" stroke-width="2"/>
  <circle cx="72" cy="60" r="18" fill="#86A17A" stroke="#161A19" stroke-width="2"/>
  <text x="72" y="67" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#161A19">Mg</text>
  <text x="88" y="38" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">2+</text>
  <circle cx="30" cy="38" r="12" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="30" y="43" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">O</text>
  <line x1="22" y1="30" x2="12" y2="22" stroke="#161A19" stroke-width="2"/>
  <circle cx="6" cy="16" r="8" fill="#F5F5F0" stroke="#161A19" stroke-width="2"/>
  <text x="6" y="19" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#161A19">H</text>
  <circle cx="120" cy="82" r="13" fill="#A62929" stroke="#161A19" stroke-width="2"/>
  <text x="120" y="87" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">Br</text>
  <text x="132" y="100" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">-</text>
  <text x="80" y="112" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">where the magnesium ends up</text>
</svg>
