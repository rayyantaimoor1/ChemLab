  <circle cx="98" cy="74" r="9" fill="#2E86C1" stroke="#161A19" stroke-width="2"/>
  <text x="98" y="77" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#FFFFFF">N</text>
  <text x="104" y="34" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">2+</text>
  <text x="80" y="104" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">six separate molecules, each held at one point</text>
  <text x="80" y="115" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">blue - where the same ion in water is green</text>
</svg>
