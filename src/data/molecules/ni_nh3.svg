<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hexaamminenickel: six ammonia molecules arranged around a nickel ion at the corners of an octahedron">
  <line x1="80" y1="56" x2="80" y2="26" stroke="#161A19" stroke-width="2"/>
  <line x1="80" y1="56" x2="80" y2="86" stroke="#161A19" stroke-width="2"/>
  <line x1="80" y1="56" x2="50" y2="56" stroke="#161A19" stroke-width="2"/>
  <line x1="80" y1="56" x2="110" y2="56" stroke="#161A19" stroke-width="2"/>
  <line x1="80" y1="56" x2="62" y2="38" stroke="#161A19" stroke-width="2"/>
  <line x1="80" y1="56" x2="98" y2="74" stroke="#161A19" stroke-width="2"/>
  <circle cx="80" cy="56" r="15" fill="#8FA5A8" stroke="#161A19" stroke-width="2"/>
  <text x="80" y="62" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#161A19">Ni</text>
  <circle cx="80" cy="26" r="9" fill="#2E86C1" stroke="#161A19" stroke-width="2"/>
  <text x="80" y="29" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#FFFFFF">N</text>
  <circle cx="80" cy="86" r="9" fill="#2E86C1" stroke="#161A19" stroke-width="2"/>
  <text x="80" y="89" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#FFFFFF">N</text>
  <circle cx="50" cy="56" r="9" fill="#2E86C1" stroke="#161A19" stroke-width="2"/>
  <text x="50" y="59" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#FFFFFF">N</text>
  <circle cx="110" cy="56" r="9" fill="#2E86C1" stroke="#161A19" stroke-width="2"/>
  <text x="110" y="59" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#FFFFFF">N</text>
  <circle cx="62" cy="38" r="9" fill="#2E86C1" stroke="#161A19" stroke-width="2"/>
