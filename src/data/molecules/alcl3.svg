<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aluminium chloride: a flat molecule with only six electrons round the aluminium where it would prefer eight. That shortage is what makes it grab a chloride off whatever it meets and create the electrophile a Friedel-Crafts reaction needs">
  <line x1="80" y1="56" x2="80" y2="24" stroke="#161A19" stroke-width="2"/>
  <line x1="80" y1="56" x2="42" y2="82" stroke="#161A19" stroke-width="2"/>
  <line x1="80" y1="56" x2="118" y2="82" stroke="#161A19" stroke-width="2"/>
  <circle cx="80" cy="56" r="17" fill="#9AA7B0" stroke="#161A19" stroke-width="2"/>
  <text x="80" y="63" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#161A19">Al</text>
  <circle cx="80" cy="16" r="14" fill="#2ECC71" stroke="#161A19" stroke-width="2"/>
  <text x="80" y="21" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0B3D1E">Cl</text>
  <circle cx="32" cy="90" r="14" fill="#2ECC71" stroke="#161A19" stroke-width="2"/>
  <text x="32" y="95" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0B3D1E">Cl</text>
  <circle cx="128" cy="90" r="14" fill="#2ECC71" stroke="#161A19" stroke-width="2"/>
  <text x="128" y="95" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0B3D1E">Cl</text>
  <text x="80" y="112" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">only 6 electrons on Al — it wants a 7th and 8th</text>
</svg>
