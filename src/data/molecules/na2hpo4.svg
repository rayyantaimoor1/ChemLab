<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The hydrogen phosphate ion: a phosphate with one hydrogen still attached, carrying two negative charges. The reagent that brings down the last cation in the scheme">
  <line x1="80" y1="58" x2="80" y2="30" stroke="#161A19" stroke-width="2"/>
  <line x1="80" y1="58" x2="50" y2="76" stroke="#161A19" stroke-width="2"/>
  <line x1="80" y1="58" x2="110" y2="76" stroke="#161A19" stroke-width="2"/>
  <line x1="80" y1="58" x2="80" y2="88" stroke="#161A19" stroke-width="2"/>
  <circle cx="80" cy="58" r="15" fill="#D98E32" stroke="#161A19" stroke-width="2"/>
  <text x="80" y="64" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">P</text>
  <circle cx="80" cy="30" r="11" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="80" y="34" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF">O</text>
  <circle cx="50" cy="76" r="11" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="50" y="80" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF">O</text>
  <circle cx="110" cy="76" r="11" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="110" y="80" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF">O</text>
  <circle cx="80" cy="88" r="11" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="80" y="92" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF">O</text>
  <circle cx="96" cy="20" r="7" fill="#F5F5F0" stroke="#161A19" stroke-width="2"/>
  <text x="96" y="23" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#161A19">H</text>
  <line x1="80" y1="30" x2="96" y2="20" stroke="#161A19" stroke-width="2"/>
  <text x="30" y="60" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">2-</text>
  <text x="80" y="108" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">one hydrogen still on - the rest come off</text>
  <text x="80" y="117" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">when ammonia is added</text>
</svg>
