<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Copper(I) sulfide: two copper ions to one sulfide. Blown with air this ore reduces itself - the sulfide gives up the electrons that turn the copper into metal">
  <line x1="46" y1="60" x2="62" y2="60" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="98" y1="60" x2="114" y2="60" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="28" cy="60" r="17" fill="#B5651D" stroke="#161A19" stroke-width="2"/>
  <text x="28" y="67" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Cu</text>
  <text x="42" y="36" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">+</text>
  <circle cx="80" cy="60" r="19" fill="#F1C40F" stroke="#161A19" stroke-width="2"/>
  <text x="80" y="67" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#161A19">S</text>
  <text x="96" y="34" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">2-</text>
  <circle cx="132" cy="60" r="17" fill="#B5651D" stroke="#161A19" stroke-width="2"/>
  <text x="132" y="67" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Cu</text>
  <text x="146" y="36" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">+</text>
  <text x="80" y="104" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">the SULFIDE is the reducing agent here —</text>
  <text x="80" y="114" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">this ore needs no carbon at all</text>
</svg>
