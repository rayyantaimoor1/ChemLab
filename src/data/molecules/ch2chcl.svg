<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Chloroethene: ethene with one hydrogen swapped for chlorine, and still carrying the carbon to carbon double bond that lets it polymerise">
  <line x1="56" y1="50" x2="100" y2="50" stroke="#161A19" stroke-width="2"/>
  <line x1="56" y1="60" x2="100" y2="60" stroke="#161A19" stroke-width="2"/>
  <circle cx="48" cy="55" r="15" fill="#2C3E50" stroke="#161A19" stroke-width="2"/>
  <text x="48" y="61" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">C</text>
  <circle cx="108" cy="55" r="15" fill="#2C3E50" stroke="#161A19" stroke-width="2"/>
  <text x="108" y="61" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">C</text>
  <line x1="38" y1="44" x2="24" y2="32" stroke="#161A19" stroke-width="2"/>
  <line x1="38" y1="66" x2="24" y2="78" stroke="#161A19" stroke-width="2"/>
  <line x1="118" y1="44" x2="132" y2="32" stroke="#161A19" stroke-width="2"/>
  <line x1="118" y1="66" x2="136" y2="78" stroke="#161A19" stroke-width="2"/>
  <circle cx="16" cy="26" r="8" fill="#F5F5F0" stroke="#161A19" stroke-width="2"/>
  <text x="16" y="29" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#161A19">H</text>
  <circle cx="16" cy="86" r="8" fill="#F5F5F0" stroke="#161A19" stroke-width="2"/>
  <text x="16" y="89" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#161A19">H</text>
  <circle cx="140" cy="26" r="8" fill="#F5F5F0" stroke="#161A19" stroke-width="2"/>
  <text x="140" y="29" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#161A19">H</text>
  <circle cx="144" cy="84" r="13" fill="#2ECC71" stroke="#161A19" stroke-width="2"/>
  <text x="144" y="89" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0B3D1E">Cl</text>
  <text x="80" y="108" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">the DOUBLE bond is what polymerises —</text>
  <text x="80" y="117" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">the chlorine just comes along for the ride</text>
</svg>
