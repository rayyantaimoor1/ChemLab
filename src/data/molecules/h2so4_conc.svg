<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sulfuric acid: sulfur with four oxygens, two of them carrying hydrogens. In the brown ring test it acts as a dehydrating agent and an oxidiser rather than simply as an acid">
  <line x1="80" y1="58" x2="80" y2="30" stroke="#161A19" stroke-width="2"/>
