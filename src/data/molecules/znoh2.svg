<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Zinc hydroxide: one zinc with two hydroxide groups. It looks identical to aluminium hydroxide in the test tube, and telling them apart is a standard problem">
  <line x1="64" y1="60" x2="46" y2="44" stroke="#161A19" stroke-width="2"/>
  <line x1="96" y1="60" x2="114" y2="76" stroke="#161A19" stroke-width="2"/>
  <circle cx="80" cy="60" r="18" fill="#5D6D7E" stroke="#161A19" stroke-width="2"/>
  <text x="80" y="67" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Zn</text>
  <text x="96" y="36" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">2+</text>
  <circle cx="36" cy="38" r="12" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="36" y="43" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">O</text>
  <circle cx="124" cy="82" r="12" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="124" y="87" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">O</text>
  <line x1="26" y1="32" x2="16" y2="26" stroke="#161A19" stroke-width="2"/>
  <line x1="134" y1="88" x2="144" y2="94" stroke="#161A19" stroke-width="2"/>
  <circle cx="10" cy="22" r="8" fill="#F5F5F0" stroke="#161A19" stroke-width="2"/>
  <text x="10" y="25" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#161A19">H</text>
  <circle cx="150" cy="98" r="8" fill="#F5F5F0" stroke="#161A19" stroke-width="2"/>
  <text x="150" y="101" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#161A19">H</text>
  <text x="80" y="112" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">looks exactly like Al(OH)₃ — ammonia tells them apart</text>
</svg>
