<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Chromium(VI) oxide, the chromium plating bath: one chromium atom bonded to three oxygens, with the chromium in its highest oxidation state. Six electrons are needed to bring it down to the metal">
  <line x1="80" y1="62" x2="80" y2="32" stroke="#161A19" stroke-width="2"/>
  <line x1="80" y1="62" x2="50" y2="82" stroke="#161A19" stroke-width="2"/>
  <line x1="80" y1="62" x2="110" y2="82" stroke="#161A19" stroke-width="2"/>
  <circle cx="80" cy="62" r="15" fill="#4E8F6D" stroke="#161A19" stroke-width="2"/>
  <text x="80" y="68" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">Cr</text>
  <circle cx="80" cy="32" r="12" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="80" y="37" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">O</text>
  <circle cx="50" cy="82" r="12" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="50" y="87" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">O</text>
  <circle cx="110" cy="82" r="12" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="110" y="87" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">O</text>
  <text x="104" y="40" font-family="sans-serif" font-size="11" font-weight="bold" fill="#161A19">6+</text>
  <text x="80" y="110" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">six electrons per atom - which is why it plates slowly</text>
</svg>
