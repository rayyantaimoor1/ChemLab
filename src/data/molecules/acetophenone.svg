<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Phenylethanone: a carbonyl group joined to a benzene ring. The carbonyl pulls electrons OUT of the ring, so the product is less reactive than the benzene it was made from and the reaction stops after one substitution">
  <line x1="62" y1="34" x2="84.5" y2="47" stroke="#161A19" stroke-width="2.2"/>
  <line x1="84.5" y1="47" x2="84.5" y2="73" stroke="#161A19" stroke-width="2.2"/>
  <line x1="84.5" y1="73" x2="62" y2="86" stroke="#161A19" stroke-width="2.2"/>
  <line x1="62" y1="86" x2="39.5" y2="73" stroke="#161A19" stroke-width="2.2"/>
  <line x1="39.5" y1="73" x2="39.5" y2="47" stroke="#161A19" stroke-width="2.2"/>
  <line x1="39.5" y1="47" x2="62" y2="34" stroke="#161A19" stroke-width="2.2"/>
  <circle cx="62" cy="60" r="14.3" fill="none" stroke="#161A19" stroke-width="2"/>
  <line x1="84.5" y1="47" x2="108" y2="62" stroke="#161A19" stroke-width="2"/>
  <line x1="103" y1="54" x2="103" y2="38" stroke="#161A19" stroke-width="2"/>
  <line x1="109" y1="54" x2="109" y2="38" stroke="#161A19" stroke-width="2"/>
  <line x1="118" y1="68" x2="134" y2="78" stroke="#161A19" stroke-width="2"/>
  <circle cx="108" cy="62" r="13" fill="#2C3E50" stroke="#161A19" stroke-width="2"/>
  <text x="108" y="67" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">C</text>
  <circle cx="106" cy="30" r="11" fill="#E74C3C" stroke="#161A19" stroke-width="2"/>
  <text x="106" y="34" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">O</text>
  <circle cx="140" cy="84" r="12" fill="#2C3E50" stroke="#161A19" stroke-width="2"/>
  <text x="140" y="89" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">C</text>
  <text x="80" y="108" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">C=O pulls electrons OUT — the ring is now deactivated</text>
  <text x="80" y="118" text-anchor="middle" font-family="sans-serif" font-size="8" font-style="italic" fill="#4A4A4A">which is why acylation stops after one</text>
</svg>
