<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ammonium carbonate: two ammonium ions and one carbonate ion. It is chosen over sodium carbonate because it is the weaker source of carbonate, and that weakness is exactly what makes the separation work">
