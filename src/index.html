<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Virtual Chemistry Lab</title>
  <link rel="stylesheet" href="styles/bench.css" />
</head>
<body>
  <header class="topbar">
    <span class="topbar__mode">MODE: Free Lab</span>
    <button id="reset-bench" type="button">Reset</button>
  </header>

  <div class="layout">
    <aside id="shelf" class="zone zone--shelf" aria-label="Reagent shelf"></aside>
    <main id="bench" class="zone zone--bench" aria-label="Bench"></main>
    <aside id="notebook" class="zone zone--notebook" aria-label="Lab notebook"></aside>
  </div>

  <script type="module" src="ui/app.js"></script>
</body>
</html>
