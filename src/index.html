<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Virtual Chemistry Lab</title>
  <link rel="icon" type="image/png" href="assets/icon-32.png" />
  <link rel="stylesheet" href="styles/bench.css" />
</head>
<body>
  <header class="topbar">
    <!--
      The brand mark - UI.md section 2's "bench-top instrument, not a web
      app" concept, stated in one glance before anything else on screen.
      Purely decorative: no id, nothing reads it, nothing dispatches from it.
    -->
    <div class="topbar__brand">
      <span class="topbar__brand-mark" aria-hidden="true"></span>
      <span class="topbar__brand-name">Virtual Chemistry Lab</span>
    </div>
    <!--
      Guided mode's topbar chrome, UI.md section 3: "MODE: Free Lab / Guided
      Experiment ▾". Owned entirely by mountGuidedBar in guided.js so the
      mode text and the picker stay in sync with the same state everything
      else re-renders from.
    -->
    <div id="guided-bar" class="guided-bar"></div>
    <label class="topbar__reduce-motion">
      <input type="checkbox" id="reduce-animation" />
      Reduce animation
    </label>
    <!--
      "Contract trace" - a developer-facing strip (see .trace-strip in
      bench.js) showing which dispatch call last ran. Not a chemistry
      feature; off by default, the same way it is in the mockup.
    -->
    <label class="topbar__reduce-motion">
      <input type="checkbox" id="contract-trace" />
      Contract trace
    </label>
    <button id="reset-bench" type="button">Reset bench</button>
  </header>

  <!--
    The guided step card, UI.md section 7's "guided step card with hint".
    Hidden by mountGuidedStepCard whenever guided mode is not active or the
    run has finished, in which case the completion summary below takes over.
  -->
  <div id="guided-stepcard"></div>

  <div class="layout">
    <aside id="shelf" class="zone zone--shelf" aria-label="Reagent shelf"></aside>
    <main id="bench" class="zone zone--bench" aria-label="Bench"></main>
    <aside id="notebook" class="zone zone--notebook" aria-label="Lab notebook"></aside>
  </div>

  <!--
    The hazard alert, from UI.md section 3's list of modal overlays. It sits
    outside .layout because it covers the whole window rather than living in
    one zone. The edge is the screen-edge flash from section 6's motion
    table; it is purely decorative, so it is hidden from screen readers and
    the alert panel carries the actual message.
  -->
  <div id="hazard-edge" class="hazard-edge" aria-hidden="true"></div>
  <div id="hazard-alert"></div>

  <!--
    The properties card, UI.md section 3's other listed modal overlay:
    name, formula, state, colour, pH, molar mass, hazards and a 2D
    structure image (section 7).
  -->
  <div id="properties-card"></div>

  <!--
    The molecular view, UI.md section 3's third modal overlay: the scripted
    animation of atoms and ions rearranging during a reaction, played from
    src/data/animations.json.
  -->
  <div id="molecular-view"></div>

  <!--
    The 3D ball-and-stick view - CLAUDE.md section 8's Phase 6 second half.
    Rotatable by mouse drag; see molecular3d.js for why it needs no library
    and has no idle render loop of its own.
  -->
  <div id="molecular-3d-view"></div>

  <!--
    The completion summary, UI.md section 3's fourth listed modal overlay,
    "Experiment step detail" - shown automatically once a guided run's last
    step is done. Compares the experiment's curated expectedResult with
    whatever the student's own bench shows right now; see guided.js's file
    header for why nothing here computes a pass/fail verdict.
  -->
  <div id="guided-summary"></div>

  <script type="module" src="ui/app.js"></script>
</body>
</html>
